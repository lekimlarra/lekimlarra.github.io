<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada</title>
  <script>
    // Redirige /Julia, /Ángela, /Irene, /Sonia… a su carpeta en minúsculas y sin tildes.
    (function () {
      var first = decodeURIComponent(location.pathname).split("/").filter(Boolean)[0] || "";
      var slug = first.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
      if (["julia", "angela", "irene", "sonia"].indexOf(slug) !== -1 && first !== slug) location.replace("/" + slug + "/");
    })();
  </script>
  <style>
    body { font-family: system-ui, sans-serif; background: #faf5ea; color: #33291f; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 20px; }
    a { color: #b85a2b; font-weight: 700; }
  </style>
</head>
<body>
  <div>
    <p style="font-size:3rem">🍂</p>
    <h1>Esta página no existe</h1>
    <p><a href="/">Volver al inicio</a></p>
  </div>
</body>
</html>
